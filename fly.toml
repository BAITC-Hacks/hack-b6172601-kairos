# Existing public application; deploy with fly deploy -a kairos-astana.
# Core analysis and viewing need no API key.

app = 'kairos-astana'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  LLM_MODEL = 'gpt-4.1-mini'
  LLM_PROVIDER = 'openai'
  RATE_LIMIT_PER_MINUTE = '20'
  TRUST_PROXY_HEADERS = 'true'
  CLIENT_IP_HEADER = 'fly-client-ip'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
