# Docker alone is sufficient: build, compute official Parquet inputs, serve.
# No .env or API key is needed. Local out/ is excluded from the build context.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Values come from a .env file in this directory when present, from the
      # shell environment otherwise, and fall back to these defaults.
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      APP_ENV: "${APP_ENV:-docker}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      AGENT_MAX_STEPS: "${AGENT_MAX_STEPS:-8}"
      AGENT_TIMEOUT_SECONDS: "${AGENT_TIMEOUT_SECONDS:-60}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-0}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      TRACE_DIR: /app/.traces
    restart: unless-stopped
